[project]
name = "critical-learning-periods"
version = "0.1.0"
description = "A typed, transparent reconstruction of critical learning periods in All-CNN."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch", "torchvision", "numpy", "pillow", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clp"]

[dependency-groups]
dev = ["pytest", "ruff", "ty", "pyright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["checks.py"]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests", "docs"]
